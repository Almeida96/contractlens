name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and package
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Verify installed CLI and source evidence
        shell: bash
        run: |
          build/install/contractlens/bin/contractlens demo --out build/orders-demo
          python checks/cli_smoke.py build/install/contractlens
      - name: Exercise the official MCP client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'mcp==1.26.0'
          python checks/mcp_smoke.py --install-dir build/install/contractlens --baseline examples/orders/baseline.json --candidate examples/orders/breaking.json --consumers examples/orders/consumers.json
          python checks/verify_witnesses.py build/orders-demo/breaking/report.json build/orders-demo/baseline.json build/orders-demo/breaking.json
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: build/test-results/test/*.xml
      - name: Prepare distribution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build/publish
          cp build/distributions/contractlens-0.1.0.zip build/publish/
          cp build/orders-demo/breaking/report.html build/publish/orders-migration.html
          cd build/publish
          sha256sum contractlens-0.1.0.zip orders-migration.html > SHA256SUMS
      - name: Save distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: build/publish/*
          if-no-files-found: error
  release:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ContractLens 0.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: release
      - name: Publish distribution, demo and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 release/contractlens-0.1.0.zip release/orders-migration.html release/SHA256SUMS --target "$GITHUB_SHA" --title "ContractLens 0.1.0" --notes-file docs/release.md
